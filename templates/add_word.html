{% extends 'base.html' %}
{% block content %}
<h1>Добавить слово в {{ movie.title }}</h1>
<form method="post">
    <label>English:</label>
    <input type="text" name="english" required><br>
    <label>Перевод:</label>
    <input type="text" name="russian" required><br>
    <label>/Контекст (предложение):</label>
    <textarea name="context"></textarea><br>
    <button type="submit">Сохранить</button>
</form>
{% endblock %}
