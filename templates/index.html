{% extends 'base.html' %}
{% block content %}
<h1>Мои фильмы</h1>
<ul>
    {% for movie in movies %}
    <li>
        <a href="/movies/{{ movie.id }}">{{ movie.title }} ({{ movie.year or '-' }})</a>
        - слов: {{ movie.words|length }}
    </li>
    {% else %}
    <li>Пока фильмов нет. Добавьте первый!</li>
    {% endfor %}
</ul>

<h2>Добавить фильм</h2>
<form action="/movies/create" method="post">
    <input type="text" name="title" placeholder="Название фильма" required>
    <input type="number" name="year" placeholder="Год">
    <button type="submit">Добавить</button>
</form>
{% endblock %}
