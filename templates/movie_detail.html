{% extends 'base.html' %}
{% block content %}
<h1>{{ movie.title }} ({{ movie.year }})</h1>
<a href="/movies/{{ movie.id }}/add-word">Добавить новое слово</a>
<hr>
<h2>Словарь ({{ words|length }})</h2>
<table>
    <tr><th>English</th><th>Русский</th><th>Контекст</th></tr>
    {% for word in words %}
    <tr>
        <td>{{ word.english }}</td>
        <td>{{ word.russian }}</td>
        <td><i>{{ word.context or '-' }}</i></td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
